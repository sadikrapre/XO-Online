<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>XO Online</title>

<style>
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent
}

html,body{
 margin:0;
 width:100%;
 min-height:100%
}

body{
 min-height:100vh;
 font-family:Arial,Tahoma,sans-serif;
 background:radial-gradient(circle at top,#18234b 0,#080b18 55%,#05060d 100%);
 color:#fff;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:14px
}

button,input{
 font-family:inherit
}

button{
 user-select:none;
 -webkit-user-select:none;
 cursor:pointer
}

.app{
 width:100%;
 max-width:430px
}

.logo{
 text-align:center;
 font-size:52px;
 font-weight:900;
 margin-bottom:2px;
 background:linear-gradient(90deg,#7c6cff,#00e5ff);
 -webkit-background-clip:text;
 background-clip:text;
 color:transparent
}

.subtitle{
 text-align:center;
 color:#9da9c9;
 margin-bottom:18px;
 font-size:15px
}

.card{
 width:100%;
 background:rgba(19,26,50,.96);
 border:1px solid rgba(255,255,255,.09);
 border-radius:25px;
 padding:18px;
 box-shadow:0 20px 55px rgba(0,0,0,.45)
}

input{
 width:100%;
 height:52px;
 border:1px solid rgba(255,255,255,.08);
 outline:none;
 border-radius:15px;
 background:#090f22;
 color:#fff;
 font-size:16px;
 padding:0 15px;
 text-align:center;
 margin-bottom:10px
}

input:focus{
 border-color:#6c63ff
}

button{
 width:100%;
 min-height:50px;
 border:0;
 border-radius:15px;
 color:white;
 font-size:16px;
 font-weight:bold;
 margin-top:8px;
 background:linear-gradient(135deg,#665cff,#00bcd4);
 transition:.15s
}

button:active{
 transform:scale(.97)
}

button:disabled{
 cursor:not-allowed;
 opacity:.65
}

.secondary{
 background:#252e4d
}

.danger{
 background:#a52d4c
}

.copy{
 background:#222c4b;
 margin-top:10px
}

.hidden{
 display:none!important
}

.status{
 text-align:center;
 min-height:24px;
 margin:14px 0 0;
 color:#aeb9d5;
 font-size:14px
}

.room{
 text-align:center;
 background:#090f22;
 border-radius:17px;
 padding:13px;
 margin-bottom:13px
}

.room-title{
 color:#9da9c9;
 font-size:13px;
 margin-bottom:5px
}

.room-code{
 color:#00e5ff;
 font-size:29px;
 font-weight:900;
 letter-spacing:6px
}

.players{
 display:flex;
 gap:9px
}

.player{
 flex:1;
 min-width:0;
 padding:12px 7px;
 background:#090f22;
 border-radius:16px;
 text-align:center;
 border:2px solid transparent
}

.player.active{
 border-color:#00e5ff;
 box-shadow:0 0 15px rgba(0,229,255,.15)
}

.player-icon{
 font-size:25px
}

.player-name{
 overflow:hidden;
 text-overflow:ellipsis;
 white-space:nowrap;
 margin-top:4px;
 font-weight:bold
}

.message{
 text-align:center;
 min-height:27px;
 margin:13px 0 7px;
 font-size:17px;
 font-weight:bold
}

.board{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:9px;
 margin:8px 0 13px
}

.cell{
 width:100%;
 aspect-ratio:1/1;
 min-height:80px;
 margin:0;
 padding:0;
 border-radius:18px;
 background:#080e20;
 border:1px solid rgba(255,255,255,.06);
 font-size:48px;
 font-weight:900;
 display:flex;
 align-items:center;
 justify-content:center;
 box-shadow:inset 0 0 15px rgba(0,0,0,.2)
}

.cell.x{
 color:#766bff
}

.cell.o{
 color:#00e5ff
}

.cell.win{
 background:linear-gradient(135deg,#274c5b,#303464);
 border-color:#00e5ff
}

.cell:disabled{
 opacity:1
}

.info{
 display:flex;
 justify-content:space-between;
 color:#9da9c9;
 font-size:13px;
 margin-bottom:4px
}

.voice-box{
 margin-top:14px;
 padding:13px;
 background:#090f22;
 border-radius:18px;
 border:1px solid rgba(255,255,255,.07);
 text-align:center
}

.voice-title{
 font-size:15px;
 font-weight:bold;
 margin-bottom:7px
}

.voice-status{
 min-height:20px;
 font-size:12px;
 color:#9da9c9;
 margin-top:7px
}

.voice-button{
 margin-top:5px;
 background:linear-gradient(135deg,#5d50ff,#00aeca)
}

.voice-button.muted{
 background:#252e4d
}

.small{
 text-align:center;
 color:#697594;
 font-size:12px;
 margin-top:14px
}

#joinBox{
 margin-top:8px
}

@media(max-width:360px){
 .card{
  padding:14px
 }

 .cell{
  min-height:70px;
  font-size:42px
 }

 .logo{
  font-size:45px
 }
}
</style>
</head>

<body>

<div class="app">

<div class="logo">XO</div>

<div class="subtitle">
لعبة XO أونلاين 🎮
</div>

<div id="home" class="card">

<input
 id="nameInput"

<div class="room">

<div id="roomCode" class="room-code">
------

📋 نسخ كود الغرفة

<div id="playerX" class="player">

</div>

</div>

<button class="cell" onclick="play(1)"></button>

<button class="cell" onclick="play(3)"></button>
<button class="cell" onclick="play(4)"></button>
<button class="cell" onclick="play(5)"></button>

<button class="cell" onclick="play(6)"></button>
<button class="cell" onclick="play(7)"></button>
<button class="cell" onclick="play(8)"></button>

<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-database-compat.js"></script>


<script>

const firebaseConfig = {
 apiKey:"AIzaSyDY2odtqfikOFiImAFUPAivKxex053rWGw",
 authDomain:"xo-ga-13a1e.firebaseapp.com",
 databaseURL:"https://xo-ga-13a1e-default-rtdb.firebaseio.com",
 projectId:"xo-ga-13a1e",
 storageBucket:"xo-ga-13a1e.firebasestorage.app",
 messagingSenderId:"708857601181",
 appId:"1:708857601181:web:8b0b3ba2920df3a7c64874",
 measurementId:"G-S4SBWVYJEC"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();

let roomId=null;
let myPlayer=null;
let playerName="";
let gameData=null;
let roomListener=null;

const cells=document.querySelectorAll(".cell");

let peerConnection=null;
let localStream=null;
let voiceEnabled=false;
let remoteCandidates=[];
let voiceListenersStarted=false;
let offerCreated=false;
let answerCreated=false;

const rtcConfig={
 iceServers:[
  {
   urls:"stun:stun.l.google.com:19302"
  }
 ]
};


function randomRoom(){

 const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

 let result="";

 for(let i=0;i<6;i++){

  result+=chars.charAt(
   Math.floor(Math.random()*chars.length)
  );

 }

 return result;
}


function getName(){

 const input=document.getElementById("nameInput");

 const name=input.value.trim();

 if(!name){

  showHomeStatus("⚠️ اكتب اسمك أولاً");

  input.focus();

  return null;
 }

 return name;
}


function showHomeStatus(text){

 document.getElementById("homeStatus").textContent=text;

}


window.showJoin=function(){

 document
  .getElementById("joinBox")
  .classList.remove("hidden");

 document
  .getElementById("roomInput")
  .focus();

};


window.createRoom=async function(){

 const name=getName();

 if(!name)return;

 playerName=name;

 showHomeStatus("⏳ جاري إنشاء الغرفة...");

 const createButton=document.getElementById("createBtn");

 createButton.disabled=true;

 try{

  let code=null;
  let roomRef=null;

  for(let i=0;i<10;i++){

   const possibleCode=randomRoom();

   const possibleRef=
    db.ref("rooms/"+possibleCode);

   const snapshot=
    await possibleRef.once("value");

   if(!snapshot.exists()){

    code=possibleCode;

    roomRef=possibleRef;

    break;
   }
  }

  if(!code){

   throw new Error("تعذر إنشاء غرفة");
  }

  roomId=code;

  myPlayer="X";

  await roomRef.set({

   playerX:{
    name:playerName,
    online:true
   },

   playerO:null,

   board:[
    "","","",
    "","","",
    "","",""
   ],

   turn:"X",

   winner:"",

   status:"waiting",

   createdAt:
    firebase.database.ServerValue.TIMESTAMP
  });

  enterGame();

  listenRoom();

 }catch(error){

  console.error("CREATE ROOM ERROR:",error);

  showHomeStatus(
   "❌ "+(error.code||error.message)
  );

 }finally{

  createButton.disabled=false;
 }

};


window.joinRoom=async function(){

 const name=getName();

 if(!name)return;

 const input=
  document.getElementById("roomInput");

 const code=
  input.value.trim().toUpperCase();

 if(code.length!==6){

  showHomeStatus(
   "⚠️ كود الغرفة يجب أن يكون 6 أحرف"
  );

  return;
 }

 playerName=name;

 showHomeStatus("⏳ جاري الدخول...");

 try{

  const roomRef=
   db.ref("rooms/"+code);

  const snapshot=
   await roomRef.once("value");

  if(!snapshot.exists()){

   showHomeStatus(
    "❌ الغرفة غير موجودة"
   );

   return;
  }

  const data=snapshot.val();

  if(data.playerO){

   showHomeStatus(
    "❌ الغرفة ممتلئة"
   );

   return;
  }

  await roomRef.update({

   playerO:{
    name:playerName,
    online:true
   },

   status:"playing"

  });

  roomId=code;

  myPlayer="O";

  enterGame();

  listenRoom();

 }catch(error){

  console.error("JOIN ERROR:",error);

  showHomeStatus(
   "❌ "+(error.code||error.message)
  );

 }

};


function enterGame(){

 document
  .getElementById("home")
  .classList.add("hidden");

 document
  .getElementById("game")
  .classList.remove("hidden");

 document
  .getElementById("roomCode")
  .textContent=roomId;

 setVoiceStatus(
  "🎤 اضغط تشغيل المايك حتى لو صديقك لم يدخل بعد"
 );

}


function listenRoom(){

 if(roomListener){

  roomListener.off();

 }

 roomListener=
  db.ref("rooms/"+roomId);

 roomListener.on(
  "value",
  async function(snapshot){

   if(!snapshot.exists()){

    stopVoice();

    alert("تم حذف الغرفة");

    location.reload();

    return;
   }

   gameData=snapshot.val();

   render();

   if(
    gameData.playerX &&
    gameData.playerO
   ){

    startVoiceListeners();

    if(voiceEnabled){

     if(myPlayer==="X"){

      await createOffer();

     }else{

      await checkExistingOffer();

     }

    }

   }

  }
 );

}


function render(){

 if(!gameData)return;

 document
  .getElementById("nameX")
  .textContent=
   gameData.playerX
    ?gameData.playerX.name
    :"انتظار...";

 document
  .getElementById("nameO")
  .textContent=
   gameData.playerO
    ?gameData.playerO.name
    :"انتظار...";


 document
  .getElementById("mySymbol")
  .textContent=
   "رمزك: "+
   (myPlayer==="X"?"❌":"⭕");


 const board=
  Array.isArray(gameData.board)
   ?gameData.board
   :[
     "","","",
     "","","",
     "","",""
    ];


 cells.forEach(
  function(cell,index){

   const value=
    board[index]||"";

   cell.textContent=
    value==="X"
     ?"×"
     :value==="O"
      ?"○"
      :"";

   cell.classList.remove(
    "x",
    "o",
    "win"
   );

   if(value==="X"){

    cell.classList.add("x");

   }

   if(value==="O"){

    cell.classList.add("o");

   }

  }
 );


 document
  .getElementById("turnInfo")
  .textContent=
   "الدور: "+
   (
    gameData.turn==="X"
     ?"❌"
     :"⭕"
   );


 document
  .getElementById("playerX")
  .classList.toggle(
   "active",
   gameData.turn==="X"
  );


 document
  .getElementById("playerO")
  .classList.toggle(
   "active",
   gameData.turn==="O"
  );


 const message=
  document.getElementById("message");


 if(!gameData.playerO){

  message.textContent=
   "⏳ بانتظار اللاعب الثاني...";

  disableCells();

  return;
 }


 if(
  gameData.winner==="X" ||
  gameData.winner==="O"
 ){

  const winner=
   gameData.winner==="X"
    ?gameData.playerX.name
    :gameData.playerO.name;

  message.textContent=
   "🏆 الفائز: "+winner;

  highlightWinning(
   getWinningCells(board)
  );

  disableCells();

  return;
 }


 if(gameData.winner==="draw"){

  message.textContent=
   "🤝 تعادل!";

  highlightWinning([]);

  disableCells();

  return;
 }


 highlightWinning([]);


 if(gameData.turn===myPlayer){

  message.textContent=
   "🎯 دورك الآن";

  enableCorrectCells();

 }else{

  message.textContent=
   "⏳ انتظر دور الخصم...";

  disableCells();

 }

}


function enableCorrectCells(){

 cells.forEach(
  function(cell,index){

   cell.disabled=
    Boolean(
     gameData.board &&
     gameData.board[index]
    );

  }
 );

}


function disableCells(){

 cells.forEach(
  function(cell){

   cell.disabled=true;

  }
 );

}


window.play=async function(index){

 if(
  !gameData ||
  !gameData.playerO ||
  gameData.winner ||
  gameData.turn!==myPlayer ||
  gameData.board[index]
 ){

  return;
 }

 try{

  await db
   .ref("rooms/"+roomId)
   .transaction(
    function(current){

     if(!current)return current;

     if(
      !current.playerX ||
      !current.playerO
     ){

      return;
     }

     if(current.winner){

      return;
     }

     if(current.turn!==myPlayer){

      return;
     }

     if(
      current.board &&
      current.board[index]
     ){

      return;
     }


     const board=
      Array.isArray(current.board)
       ?[...current.board]
       :[
        "","","",
        "","","",
        "","",""
       ];


     board[index]=myPlayer;


     const winner=
      checkWinner(board);


     let gameWinner="";


     if(winner){

      gameWinner=winner;

     }else if(
      board.every(
       function(v){
        return Boolean(v);
       }
      )
     ){

      gameWinner="draw";

     }


     current.board=board;

     current.turn=
      myPlayer==="X"
       ?"O"
       :"X";

     current.winner=
      gameWinner;

     current.status=
      gameWinner
       ?"finished"
       :"playing";


     return current;

    }
   );

 }catch(error){

  console.error(
   "PLAY ERROR:",
   error
  );

 }

};


function checkWinner(board){

 const lines=[

  [0,1,2],
  [3,4,5],
  [6,7,8],

  [0,3,6],
  [1,4,7],
  [2,5,8],

  [0,4,8],
  [2,4,6]

 ];


 for(
  const line of lines
 ){

  const[a,b,c]=line;

  if(
   board[a] &&
   board[a]===board[b] &&
   board[a]===board[c]
  ){

   return board[a];

  }

 }

 return "";
}


function getWinningCells(board){

 const lines=[

  [0,1,2],
  [3,4,5],
  [6,7,8],

  [0,3,6],
  [1,4,7],
  [2,5,8],

  [0,4,8],
  [2,4,6]

 ];


 for(
  const line of lines
 ){

  const[a,b,c]=line;

  if(
   board[a] &&
   board[a]===board[b] &&
   board[a]===board[c]
  ){

   return line;

  }

 }

 return [];
}


function highlightWinning(list){

 cells.forEach(
  function(cell,index){

   if(list.includes(index)){

    cell.classList.add("win");

   }

  }
 );

}


window.newGame=async function(){

 if(
  !roomId ||
  !gameData ||
  !gameData.playerO
 ){

  return;
 }

 try{

  await db
   .ref("rooms/"+roomId)
   .update({

    board:[
     "","","",
     "","","",
     "","",""
    ],

    turn:"X",

    winner:"",

    status:"playing"

   });

 }catch(error){

  console.error(
   "NEW GAME ERROR:",
   error
  );

 }

};


window.copyRoomCode=async function(){

 if(!roomId)return;

 try{

  await navigator.clipboard.writeText(
   roomId
  );

  alert(
   "✅ تم نسخ كود الغرفة"
  );

 }catch(error){

  prompt(
   "انسخ كود الغرفة:",
   roomId
  );

 }

};


function voiceRef(){

 return db.ref(
  "rooms/"+roomId+"/voice"
 );

}


function setVoiceStatus(text){

 const element=
  document.getElementById(
   "voiceStatus"
  );

 if(element){

  element.textContent=text;

 }

}


window.toggleVoice=async function(){

 if(!roomId)return;

 if(!voiceEnabled){

  await startVoice();

 }else{

  muteVoice();

 }

};


async function startVoice(){

 try{

  if(!window.isSecureContext){

   setVoiceStatus(
    "❌ المايك يحتاج HTTPS"
   );

   return;
  }


  if(
   !navigator.mediaDevices ||
   !navigator.mediaDevices.getUserMedia
  ){

   setVoiceStatus(
    "❌ المتصفح لا يدعم الميكروفون"
   );

   return;
  }


  if(localStream){

   localStream
    .getAudioTracks()
    .forEach(
     function(track){

      track.enabled=true;

     }
    );

  }else{

   localStream=
    await navigator.mediaDevices
     .getUserMedia({

      audio:{
       echoCancellation:true,
       noiseSuppression:true,
       autoGainControl:true
      },

      video:false

     });

  }


  voiceEnabled=true;

  updateVoiceButton();


  if(
   !gameData ||
   !gameData.playerX ||
   !gameData.playerO
  ){

   setVoiceStatus(
    "🎤 المايك يعمل — بانتظار دخول صديقك"
   );

   return;
  }


  startVoiceListeners();


  if(myPlayer==="X"){

   await createOffer();

  }else{

   await checkExistingOffer();

  }


 }catch(error){

  console.error(
   "VOICE ERROR:",
   error
  );

  voiceEnabled=false;

  updateVoiceButton();


  if(
   error.name==="NotAllowedError" ||
   error.name==="PermissionDeniedError"
  ){

   setVoiceStatus(
    "❌ تم رفض المايك. اسمح للتطبيق باستخدام الميكروفون"
   );

  }else if(
   error.name==="NotFoundError"
  ){

   setVoiceStatus(
    "❌ لم يتم العثور على ميكروفون"
   );

  }else if(
   error.name==="NotReadableError"
  ){

   setVoiceStatus(
    "❌ الميكروفون مستخدم من تطبيق آخر"
   );

  }else{

   setVoiceStatus(
    "❌ "+error.name
   );

  }

 }

}


function createPeerConnection(){

 if(peerConnection){

  return peerConnection;

 }


 peerConnection=
  new RTCPeerConnection(
   rtcConfig
  );


 if(localStream){

  localStream
   .getTracks()
   .forEach(
    function(track){

     peerConnection.addTrack(
      track,
      localStream
     );

    }
   );

 }


 peerConnection.ontrack=
  async function(event){

   const audio=
    document.getElementById(
     "remoteAudio"
    );


   if(
    event.streams &&
    event.streams[0]
   ){

    audio.srcObject=
     event.streams[0];


    try{

     await audio.play();

    }catch(error){

     console.log(
      "Audio play:",
      error
     );

    }

   }


   setVoiceStatus(
    "🔊 الصوت متصل"
   );

  };


 peerConnection.onicecandidate=
  function(event){

   if(!event.candidate)return;


   const path=
    myPlayer==="X"
     ?"callerCandidates"
     :"calleeCandidates";


   voiceRef()
    .child(path)
    .push(
     event.candidate.toJSON()
    );

  };


 peerConnection.onconnectionstatechange=
  function(){

   if(!peerConnection)return;


   const state=
    peerConnection.connectionState;


   if(state==="connected"){

    setVoiceStatus(
     "🔊 الصوت متصل"
    );

   }


   if(state==="connecting"){

    setVoiceStatus(
     "⏳ جاري الاتصال بالصوت..."
    );

   }


   if(state==="disconnected"){

    setVoiceStatus(
     "⚠️ انقطع الصوت مؤقتاً"
    );

   }


   if(state==="failed"){

    setVoiceStatus(
     "❌ فشل اتصال الصوت"
    );

   }

  };


 return peerConnection;

}


function startVoiceListeners(){

 if(voiceListenersStarted){

  return;

 }

 voiceListenersStarted=true;


 const ref=voiceRef();


 if(myPlayer==="O"){

  ref
   .child("offer")
   .on(
    "value",
    async function(snapshot){

     if(!snapshot.exists())return;


     if(!voiceEnabled){

      setVoiceStatus(
       "🎤 صديقك جاهز — شغّل المايك"
      );

      return;
     }


     await handleOffer(
      snapshot.val()
     );

    }
   );


  ref
   .child("callerCandidates")
   .on(
    "child_added",
    async function(snapshot){

     await receiveCandidate(
      snapshot.val()
     );

    }
   );

 }


 if(myPlayer==="X"){

  ref
   .child("answer")
   .on(
    "value",
    async function(snapshot){

     if(
      !snapshot.exists() ||
      !peerConnection ||
      answerCreated
     ){

      return;
     }


     try{

      answerCreated=true;


      await peerConnection
       .setRemoteDescription(
        new RTCSessionDescription(
         snapshot.val()
        )
       );


      await addPendingCandidates();


      setVoiceStatus(
       "🔊 تم الاتصال بالصوت"
      );


     }catch(error){

      answerCreated=false;

      console.error(
       "ANSWER ERROR:",
       error
      );

     }

    }
   );


  ref
   .child("calleeCandidates")
   .on(
    "child_added",
    async function(snapshot){

     await receiveCandidate(
      snapshot.val()
     );

    }
   );

 }

}


async function createOffer(){

 if(
  !voiceEnabled ||
  myPlayer!=="X" ||
  !gameData ||
  !gameData.playerO
 ){

  return;
 }


 createPeerConnection();


 if(offerCreated){

  return;

 }


 try{

  const offer=
   await peerConnection.createOffer();


  await peerConnection
   .setLocalDescription(offer);


  await voiceRef()
   .child("offer")
   .set({

    type:offer.type,
    sdp:offer.sdp

   });


  offerCreated=true;


  setVoiceStatus(
   "⏳ بانتظار اتصال صوت صديقك..."
  );


 }catch(error){

  console.error(
   "OFFER ERROR:",
   error
  );


  setVoiceStatus(
   "❌ تعذر إنشاء الاتصال الصوتي"
  );

 }

}


async function checkExistingOffer(){

 if(
  !voiceEnabled ||
  myPlayer!=="O"
 ){

  return;
 }


 createPeerConnection();


 try{

  const snapshot=
   await voiceRef()
    .child("offer")
    .once("value");


  if(snapshot.exists()){

   await handleOffer(
    snapshot.val()
   );

  }else{

   setVoiceStatus(
    "🎤 المايك يعمل — بانتظار صديقك"
   );

  }

 }catch(error){

  console.error(
   "CHECK OFFER ERROR:",
   error
  );

 }

}


async function handleOffer(offer){

 if(
  !voiceEnabled ||
  myPlayer!=="O"
 ){

  return;
 }


 createPeerConnection();


 if(
  peerConnection.currentRemoteDescription
 ){

  return;
 }


 try{

  await peerConnection
   .setRemoteDescription(
    new RTCSessionDescription(
     offer
    )
   );


  await addPendingCandidates();


  const answer=
   await peerConnection.createAnswer();


  await peerConnection
   .setLocalDescription(answer);


  await voiceRef()
   .child("answer")
   .set({

    type:answer.type,
    sdp:answer.sdp

   });


  setVoiceStatus(
   "⏳ جاري الاتصال بالصوت..."
  );


 }catch(error){

  console.error(
   "HANDLE OFFER ERROR:",
   error
  );


  setVoiceStatus(
   "❌ تعذر الاتصال بالصوت"
  );

 }

}


async function receiveCandidate(candidate){

 if(!candidate)return;


 if(
  !peerConnection ||
  !peerConnection.remoteDescription
 ){

  remoteCandidates.push(candidate);

  return;
 }


 try{

  await peerConnection
   .addIceCandidate(
    new RTCIceCandidate(candidate)
   );

 }catch(error){

  console.error(
   "ICE ERROR:",
   error
  );

 }

}


async function addPendingCandidates(){

 if(
  !peerConnection ||
  !peerConnection.remoteDescription
 ){

  return;
 }


 const list=
  [...remoteCandidates];


 remoteCandidates=[];


 for(
  const candidate of list
 ){

  try{

   await peerConnection
    .addIceCandidate(
     new RTCIceCandidate(
      candidate
     )
    );

  }catch(error){

   console.error(
    "PENDING ICE ERROR:",
    error
   );

  }

 }

}


function muteVoice(){

 if(localStream){

  localStream
   .getAudioTracks()
   .forEach(
    function(track){

     track.enabled=false;

    }
   );

 }


 voiceEnabled=false;

 updateVoiceButton();


 setVoiceStatus(
  "🔇 المايك مكتوم"
 );

}


function updateVoiceButton(){

 const button=
  document.getElementById(
   "voiceBtn"
  );


 if(!button)return;


 if(voiceEnabled){

  button.textContent=
   "🔇 كتم المايك";

  button.classList.remove(
   "muted"
  );

 }else{

  button.textContent=
   "🎤 تشغيل المايك";

  button.classList.add(
   "muted"
  );

 }

}


function stopVoice(){

 try{

  if(peerConnection){

   peerConnection.ontrack=null;

   peerConnection.onicecandidate=null;

   peerConnection.close();

  }

 }catch(error){

  console.error(error);

 }


 peerConnection=null;


 if(localStream){

  localStream
   .getTracks()
   .forEach(
    function(track){

     track.stop();

    }
   );

 }


 localStream=null;

 voiceEnabled=false;

 remoteCandidates=[];

 voiceListenersStarted=false;

 offerCreated=false;

 answerCreated=false;


 const audio=
  document.getElementById(
   "remoteAudio"
  );


 if(audio){

  audio.srcObject=null;

 }


 updateVoiceButton();

}


async function removeVoiceData(){

 if(!roomId)return;

 try{

  await voiceRef().remove();

 }catch(error){

  console.error(
   "REMOVE VOICE ERROR:",
   error
  );

 }

}


window.leaveRoom=async function(){

 if(!roomId){

  location.reload();

  return;
 }


 stopVoice();


 try{

  const roomRef=
   db.ref("rooms/"+roomId);


  if(myPlayer==="X"){

   await roomRef.remove();

  }else{

   await roomRef.update({

    playerO:null,

    status:"waiting",

    winner:""

   });


   await removeVoiceData();

  }


 }catch(error){

  console.error(
   "LEAVE ERROR:",
   error
  );

 }


 location.reload();

};


window.addEventListener(
 "beforeunload",
 function(){

  stopVoice();

 }
);


console.log(
 "🔥 XO Online جاهز"
);

</script>
