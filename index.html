<script>

const firebaseConfig = {

 apiKey:"AIzaSyDY2odtqfikOFiImAFUPAivKxex053rWGw",

 authDomain:"xo-ga-13a1e.firebaseapp.com",

 databaseURL:"https://xo-ga-13a1e-default-rtdb.firebaseio.com",

 projectId:"xo-ga-13a1e",

 storageBucket:"xo-ga-13a1e.firebasestorage.app",

 messagingSenderId:"708857601181",

 appId:"1:708857601181:web:8b0b3ba2920df3a7c64874",

 measurementId:"G-S4SBWVYJEC"

};


firebase.initializeApp(firebaseConfig);

const db=firebase.database();


let roomId=null;
let myPlayer=null;
let playerName="";
let gameData=null;
let roomListener=null;

const cells=document.querySelectorAll(".cell");



/* =========================
   WEBRTC CAMERA + AUDIO
========================= */

let peerConnection=null;
let localStream=null;

let cameraEnabled=false;

let remoteCandidates=[];

let cameraListenersStarted=false;

let offerCreated=false;

let answerCreated=false;


const rtcConfig={

 iceServers:[

  {
   urls:"stun:stun.l.google.com:19302"
  }

 ]

};



/* =========================
   ROOM
========================= */

function randomRoom(){

 const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

 let result="";

 for(let i=0;i<6;i++){

  result+=chars.charAt(
   Math.floor(Math.random()*chars.length)
  );

 }

 return result;

}



function getName(){

 const input=document.getElementById("nameInput");

 const name=input.value.trim();

 if(!name){

  showHomeStatus("⚠️ اكتب اسمك أولاً");

  input.focus();

  return null;

 }

 return name;

}



function showHomeStatus(text){

 document.getElementById("homeStatus").textContent=text;

}



window.showJoin=function(){

 document
  .getElementById("joinBox")
  .classList.remove("hidden");

 document
  .getElementById("roomInput")
  .focus();

};



/* =========================
   CREATE ROOM
========================= */

window.createRoom=async function(){

 const name=getName();

 if(!name)return;

 playerName=name;

 showHomeStatus("⏳ جاري إنشاء الغرفة...");

 try{

  let code=null;

  let roomRef=null;


  for(let i=0;i<10;i++){

   const possibleCode=randomRoom();

   const possibleRef=
    db.ref("rooms/"+possibleCode);

   const snapshot=
    await possibleRef.once("value");


   if(!snapshot.exists()){

    code=possibleCode;

    roomRef=possibleRef;

    break;

   }

  }


  if(!code){

   throw new Error("تعذر إنشاء الغرفة");

  }


  roomId=code;

  myPlayer="X";


  await roomRef.set({

   playerX:{
    name:playerName,
    online:true
   },

   playerO:null,

   board:[
    "","","",
    "","","",
    "","",""
   ],

   turn:"X",

   winner:"",

   status:"waiting",

   createdAt:
    firebase.database.ServerValue.TIMESTAMP

  });


  enterGame();

  listenRoom();

 }catch(error){

  console.error(error);

  showHomeStatus(
   "❌ "+(error.code||error.message)
  );

 }

};



/* =========================
   JOIN ROOM
========================= */

window.joinRoom=async function(){

 const name=getName();

 if(!name)return;


 const code=
  document
   .getElementById("roomInput")
   .value
   .trim()
   .toUpperCase();


 if(code.length!==6){

  showHomeStatus(
   "⚠️ كود الغرفة يجب أن يكون 6 أحرف"
  );

  return;

 }


 playerName=name;

 showHomeStatus("⏳ جاري الدخول...");


 try{

  const roomRef=
   db.ref("rooms/"+code);

  const snapshot=
   await roomRef.once("value");


  if(!snapshot.exists()){

   showHomeStatus(
    "❌ الغرفة غير موجودة"
   );

   return;

  }


  const data=snapshot.val();


  if(data.playerO){

   showHomeStatus(
    "❌ الغرفة ممتلئة"
   );

   return;

  }


  await roomRef.update({

   playerO:{
    name:playerName,
    online:true
   },

   status:"playing"

  });


  roomId=code;

  myPlayer="O";


  enterGame();

  listenRoom();


 }catch(error){

  console.error(error);

  showHomeStatus(
   "❌ "+(error.code||error.message)
  );

 }

};



function enterGame(){

 document
  .getElementById("home")
  .classList.add("hidden");


 document
  .getElementById("game")
  .classList.remove("hidden");


 document
  .getElementById("roomCode")
  .textContent=roomId;


 setCameraStatus(
  "📹 اضغط تشغيل الكاميرا حتى تبدأ الكاميرا والصوت"
 );

}



/* =========================
   LISTEN ROOM
========================= */

function listenRoom(){

 if(roomListener)
  roomListener.off();


 roomListener=
  db.ref("rooms/"+roomId);


 roomListener.on(
  "value",
  async function(snapshot){

   if(!snapshot.exists()){

    stopCamera();

    alert("تم حذف الغرفة");

    location.reload();

    return;

   }


   gameData=snapshot.val();

   render();


   if(
    gameData.playerX &&
    gameData.playerO
   ){

    startCameraListeners();


    if(cameraEnabled){

     if(myPlayer==="X"){

      await createOffer();

     }else{

      await checkExistingOffer();

     }

    }

   }

  }
 );

}



/* =========================
   RENDER GAME
========================= */

function render(){

 if(!gameData)return;


 document
  .getElementById("nameX")
  .textContent=
   gameData.playerX
    ?gameData.playerX.name
    :"انتظار...";


 document
  .getElementById("nameO")
  .textContent=
   gameData.playerO
    ?gameData.playerO.name
    :"انتظار...";


 document
  .getElementById("mySymbol")
  .textContent=
   "رمزك: "+
   (myPlayer==="X"?"❌":"⭕");


 const board=
  Array.isArray(gameData.board)
   ?gameData.board
   :[
     "","","",
     "","","",
     "","",""
    ];


 cells.forEach(function(cell,index){

  const value=board[index]||"";


  cell.textContent=
   value==="X"
    ?"×"
    :value==="O"
     ?"○"
     :"";


  cell.classList.remove(
   "x",
   "o",
   "win"
  );


  if(value==="X")
   cell.classList.add("x");


  if(value==="O")
   cell.classList.add("o");

 });


 document
  .getElementById("turnInfo")
  .textContent=
   "الدور: "+
   (
    gameData.turn==="X"
     ?"❌"
     :"⭕"
   );


 document
  .getElementById("playerX")
  .classList.toggle(
   "active",
   gameData.turn==="X"
  );


 document
  .getElementById("playerO")
  .classList.toggle(
   "active",
   gameData.turn==="O"
  );


 const message=
  document.getElementById("message");


 if(!gameData.playerO){

  message.textContent=
   "⏳ بانتظار اللاعب الثاني...";

  disableCells();

  return;

 }


 if(
  gameData.winner==="X" ||
  gameData.winner==="O"
 ){

  const winner=
   gameData.winner==="X"
    ?gameData.playerX.name
    :gameData.playerO.name;


  message.textContent=
   "🏆 الفائز: "+winner;


  highlightWinning(
   getWinningCells(board)
  );


  disableCells();

  return;

 }


 if(gameData.winner==="draw"){

  message.textContent=
   "🤝 تعادل!";


  highlightWinning([]);

  disableCells();

  return;

 }


 highlightWinning([]);


 if(gameData.turn===myPlayer){

  message.textContent=
   "🎯 دورك الآن";


  enableCorrectCells();

 }else{

  message.textContent=
   "⏳ انتظر دور الخصم...";


  disableCells();

 }

}



function enableCorrectCells(){

 cells.forEach(
  function(cell,index){

   cell.disabled=
    Boolean(
     gameData.board &&
     gameData.board[index]
    );

  }
 );

}



function disableCells(){

 cells.forEach(
  function(cell){

   cell.disabled=true;

  }
 );

}



/* =========================
   PLAY
========================= */

window.play=async function(index){

 if(
  !gameData ||
  !gameData.playerO ||
  gameData.winner ||
  gameData.turn!==myPlayer ||
  gameData.board[index]
 )return;


 try{

  await db
   .ref("rooms/"+roomId)
   .transaction(
    function(current){

     if(!current)return current;

     if(
      !current.playerX ||
      !current.playerO
     )return;

     if(current.winner)return;

     if(current.turn!==myPlayer)return;

     if(current.board[index])return;


     const board=
      Array.isArray(current.board)
       ?[...current.board]
       :[
        "","","",
        "","","",
        "","",""
       ];


     board[index]=myPlayer;


     const winner=
      checkWinner(board);


     let gameWinner="";


     if(winner){

      gameWinner=winner;

     }else if(
      board.every(
       v=>Boolean(v)
      )
     ){

      gameWinner="draw";

     }


     current.board=board;

     current.turn=
      myPlayer==="X"
       ?"O"
       :"X";

     current.winner=gameWinner;

     current.status=
      gameWinner
       ?"finished"
       :"playing";


     return current;

    }
   );


 }catch(error){

  console.error(error);

 }

};



function checkWinner(board){

 const lines=[

  [0,1,2],

  [3,4,5],

  [0,3,6],

  [1,4,7],

  [2,5,8],

  [0,4,8],

  [2,4,6]

 ];


 for(const line of lines){

  const[a,b,c]=line;


  if(
   board[a] &&
   board[a]===board[b] &&
   board[a]===board[c]
  ){

   return board[a];

  }

 }


 return "";

}



function getWinningCells(board){

 const lines=[

  [0,1,2],

  [3,4,5],

  [0,3,6],

  [1,4,7],

  [2,5,8],

  [0,4,8],

  [2,4,6]

 ];


 for(const line of lines){

  const[a,b,c]=line;


  if(
   board[a] &&
   board[a]===board[b] &&
   board[a]===board[c]
  ){

   return line;

  }

 }


 return [];

}



function highlightWinning(list){

 cells.forEach(
  function(cell,index){

   if(list.includes(index))
    cell.classList.add("win");

  }
 );

}



/* =========================
   NEW GAME
========================= */

window.newGame=async function(){

 if(
  !roomId ||
  !gameData ||
  !gameData.playerO
 )return;


 try{

  await db
   .ref("rooms/"+roomId)
   .update({

    board:[
     "","","",
     "","","",
     "","",""
    ],

    turn:"X",

    winner:"",

    status:"playing"

   });


 }catch(error){

  console.error(error);

 }

};



/* =========================
   COPY ROOM
========================= */

window.copyRoomCode=async function(){

  await navigator.clipboard.writeText(roomId);

  alert("✅ تم نسخ كود الغرفة");

  prompt(

/* =========================
   CAMERA HELPERS
========================= */

function cameraRef(){

 return db.ref(
  "rooms/"+roomId+"/camera"
 );

}



function setCameraStatus(text){

 const element=
  document.getElementById(
   "cameraStatus"
  );

 if(element)
  element.textContent=text;

}



/* =========================
   TOGGLE CAMERA
========================= */

window.toggleCamera=async function(){

 if(!roomId)return;


 if(!cameraEnabled){

  await startCamera();

 }else{

  muteCamera();

 }

};



/* =========================
   START CAMERA
========================= */

async function startCamera(){

 try{

  if(!window.isSecureContext){

   setCameraStatus(
    "❌ الكاميرا تحتاج HTTPS"
   );

   return;

  }


  if(
   !navigator.mediaDevices ||
   !navigator.mediaDevices.getUserMedia
  ){

   setCameraStatus(
    "❌ المتصفح لا يدعم الكاميرا"
   );

   return;

  }


  if(localStream){

   localStream
    .getAudioTracks()
    .forEach(
     function(track){

      track.enabled=true;

     }
    );


   localStream
    .getVideoTracks()
    .forEach(
     function(track){

      track.enabled=true;

     }
    );

  }else{

   localStream=
    await navigator.mediaDevices.getUserMedia({

     audio:{
      echoCancellation:true,
      noiseSuppression:true,
      autoGainControl:true
     },

     video:{
      facingMode:"user",
      width:{
       ideal:640
      },
      height:{
       ideal:480
      }
     }

    });

  }


  const localVideo=
   document.getElementById(
    "localVideo"
   );


  localVideo.srcObject=
   localStream;


  try{

   await localVideo.play();

  }catch(e){}


  cameraEnabled=true;

  updateCameraButton();


  if(
   !gameData ||
   !gameData.playerX ||
   !gameData.playerO
  ){

   setCameraStatus(
    "📹 الكاميرا والصوت يعملان — بانتظار صديقك"
   );

   return;

  }


  startCameraListeners();


  if(myPlayer==="X"){

   await createOffer();

  }else{

   await checkExistingOffer();

  }


 }catch(error){

  console.error(
   "CAMERA ERROR:",
   error
  );


  cameraEnabled=false;

  updateCameraButton();


  if(
   error.name==="NotAllowedError" ||
   error.name==="PermissionDeniedError"
  ){

   setCameraStatus(
    "❌ تم رفض الكاميرا أو المايك. اسمح بالصلاحية"
   );

  }else if(
   error.name==="NotFoundError"
  ){

   setCameraStatus(
    "❌ لم يتم العثور على الكاميرا أو المايك"
   );

  }else if(
   error.name==="NotReadableError"
  ){

   setCameraStatus(
    "❌ الكاميرا مستخدمة من تطبيق آخر"
   );

  }else{

   setCameraStatus(
    "❌ "+error.name
   );

  }

 }

}



/* =========================
   CREATE PEER
========================= */

function createPeerConnection(){

 if(peerConnection)
  return peerConnection;


 peerConnection=
  new RTCPeerConnection(
   rtcConfig
  );


 if(localStream){

  localStream
   .getTracks()
   .forEach(
    function(track){

     peerConnection.addTrack(
      track,
      localStream
     );

    }
   );

 }


 peerConnection.ontrack=
  async function(event){

   const remoteVideo=
    document.getElementById(
     "remoteVideo"
    );


   if(
    event.streams &&
    event.streams[0]
   ){

    remoteVideo.srcObject=
     event.streams[0];


    try{

     await remoteVideo.play();

    }catch(error){

     console.log(
      "Remote video play:",
      error
     );

    }

   }


   setCameraStatus(
    "🔊📹 الكاميرا والصوت متصلان"
   );

  };



 peerConnection.onicecandidate=
  function(event){

   if(!event.candidate)
    return;


   const path=
    myPlayer==="X"
     ?"callerCandidates"
     :"calleeCandidates";


   cameraRef()
    .child(path)
    .push(
     event.candidate.toJSON()
    );

  };



 peerConnection.onconnectionstatechange=
  function(){

   if(!peerConnection)
    return;


   const state=
    peerConnection.connectionState;


   if(state==="connected"){

    setCameraStatus(
     "🔊📹 متصل بالكاميرا والصوت"
    );

   }


   if(state==="connecting"){

    setCameraStatus(
     "⏳ جاري الاتصال بالكاميرا..."
    );

   }


   if(state==="disconnected"){

    setCameraStatus(
     "⚠️ انقطع الاتصال مؤقتاً"
    );

   }


   if(state==="failed"){

    setCameraStatus(
     "❌ فشل اتصال الكاميرا"
    );

   }

  };


 return peerConnection;

}



/* =========================
   LISTENERS
========================= */

function startCameraListeners(){

 if(cameraListenersStarted)
  return;


 cameraListenersStarted=true;


 const ref=cameraRef();


 /* O */

 if(myPlayer==="O"){

  ref
   .child("offer")
   .on(
    "value",
    async function(snapshot){

     if(!snapshot.exists())
      return;


     if(!cameraEnabled){

      setCameraStatus(
       "📹 صديقك جاهز — شغّل الكاميرا"
      );

      return;

     }


     await handleOffer(
      snapshot.val()
     );

    }
   );


  ref
   .child("callerCandidates")
   .on(
    "child_added",
    async function(snapshot){

     await receiveCandidate(
      snapshot.val()
     );

    }
   );

 }


 /* X */

 if(myPlayer==="X"){

  ref
   .child("answer")
   .on(
    "value",
    async function(snapshot){

     if(
      !snapshot.exists() ||
      !peerConnection ||
      answerCreated
     )return;


     try{

      answerCreated=true;


      await peerConnection
       .setRemoteDescription(
        new RTCSessionDescription(
         snapshot.val()
        )
       );


      await addPendingCandidates();


      setCameraStatus(
       "🔊📹 تم الاتصال بالكاميرا والصوت"
      );


     }catch(error){

      answerCreated=false;

      console.error(
       "ANSWER ERROR:",
       error
      );

     }

    }
   );


  ref
   .child("calleeCandidates")
   .on(
    "child_added",
    async function(snapshot){

     await receiveCandidate(
      snapshot.val()
     );

    }
   );

 }

}



/* =========================
   CREATE OFFER
========================= */

async function createOffer(){

 if(
  !cameraEnabled ||
  myPlayer!=="X" ||
  !gameData ||
  !gameData.playerO
 )return;


 createPeerConnection();


 if(offerCreated)
  return;


 try{

  const offer=
   await peerConnection.createOffer();


  await peerConnection
   .setLocalDescription(offer);


  await cameraRef()
   .child("offer")
   .set({

    type:offer.type,

    sdp:offer.sdp

   });


  offerCreated=true;


  setCameraStatus(
   "⏳ بانتظار اتصال صديقك بالكاميرا..."
  );


 }catch(error){

  console.error(
   "OFFER ERROR:",
   error
  );


  setCameraStatus(
   "❌ تعذر إنشاء اتصال الكاميرا"
  );

 }

}



/* =========================
   CHECK OFFER
========================= */

async function checkExistingOffer(){

 if(
  !cameraEnabled ||
  myPlayer!=="O"
 )
  return;


 createPeerConnection();


 try{

  const snapshot=
   await cameraRef()
    .child("offer")
    .once("value");


  if(snapshot.exists()){

   await handleOffer(
    snapshot.val()
   );

  }else{

   setCameraStatus(
    "📹 الكاميرا تعمل — بانتظار صديقك"
   );

  }

 }catch(error){

  console.error(error);

 }

}



/* =========================
   HANDLE OFFER
========================= */

async function handleOffer(offer){

 if(
  !cameraEnabled ||
  myPlayer!=="O"
 )
  return;


 createPeerConnection();


 if(
  peerConnection.currentRemoteDescription
 )
  return;


 try{

  await peerConnection
   .setRemoteDescription(
    new RTCSessionDescription(
     offer
    )
   );


  await addPendingCandidates();


  const answer=
   await peerConnection.createAnswer();


  await peerConnection
   .setLocalDescription(answer);


  await cameraRef()
   .child("answer")
   .set({

    type:answer.type,

    sdp:answer.sdp

   });


  setCameraStatus(
   "⏳ جاري الاتصال بالكاميرا والصوت..."
  );


 }catch(error){

  console.error(
   "HANDLE OFFER ERROR:",
   error
  );


  setCameraStatus(
   "❌ تعذر الاتصال بالكاميرا"
  );

 }

}



/* =========================
   ICE
========================= */

async function receiveCandidate(candidate){

 if(!candidate)
  return;


 if(
  !peerConnection ||
  !peerConnection.remoteDescription
 ){

  remoteCandidates.push(
   candidate
  );

  return;

 }


 try{

  await peerConnection
   .addIceCandidate(
    new RTCIceCandidate(
     candidate
    )
   );

 }catch(error){

  console.error(
   "ICE ERROR:",
   error
  );

 }

}



async function addPendingCandidates(){

 if(
  !peerConnection ||
  !peerConnection.remoteDescription
 )
  return;


 const list=[
  ...remoteCandidates
 ];


 remoteCandidates=[];


 for(
  const candidate of list
 ){

  try{

   await peerConnection
    .addIceCandidate(
     new RTCIceCandidate(
      candidate
     )
    );

  }catch(error){

   console.error(
    "PENDING ICE ERROR:",
    error
   );

  }

 }

}



/* =========================
   MUTE CAMERA
========================= */

function muteCamera(){

 if(localStream){

  localStream
   .getAudioTracks()
   .forEach(
    function(track){

     track.enabled=false;

    }
   );


  localStream
   .getVideoTracks()
   .forEach(
    function(track){

     track.enabled=false;

    }
   );

 }


 cameraEnabled=false;

 updateCameraButton();


 setCameraStatus(
  "🔇 الكاميرا والمايك مكتومان"
 );

}



/* =========================
   BUTTON
========================= */

function updateCameraButton(){

 const button=
  document.getElementById(
   "cameraBtn"
  );


 if(!button)
  return;


 if(cameraEnabled){

  button.textContent=
   "🔇 إيقاف الكاميرا والمايك";

  button.classList.remove("off");

 }else{

  button.textContent=
   "📹 تشغيل الكاميرا";

  button.classList.add("off");

 }

}



/* =========================
   STOP CAMERA
========================= */

function stopCamera(){

 try{

  if(peerConnection){

   peerConnection.ontrack=null;

   peerConnection.onicecandidate=null;

   peerConnection.close();

  }

 }catch(error){

  console.error(error);

 }


 peerConnection=null;


 if(localStream){

  localStream
   .getTracks()
   .forEach(
    function(track){

     track.stop();

    }
   );

 }


 localStream=null;

 cameraEnabled=false;

 remoteCandidates=[];

 cameraListenersStarted=false;

 offerCreated=false;

 answerCreated=false;


 const localVideo=
  document.getElementById(
   "localVideo"
  );


 const remoteVideo=
  document.getElementById(
   "remoteVideo"
  );


 if(localVideo)
  localVideo.srcObject=null;


 if(remoteVideo)
  remoteVideo.srcObject=null;


 updateCameraButton();

}



/* =========================
   REMOVE CAMERA DATA
========================= */

async function removeCameraData(){

 if(!roomId)
  return;


 try{

  await cameraRef().remove();

 }catch(error){

  console.error(error);

 }

}



/* =========================
   LEAVE
========================= */

window.leaveRoom=async function(){

 if(!roomId){

  location.reload();

  return;

 }


 stopCamera();


 try{

  const roomRef=
   db.ref("rooms/"+roomId);


  if(myPlayer==="X"){

   await roomRef.remove();

  }else{

   await roomRef.update({

    playerO:null,

    status:"waiting",

    winner:""

   });


   await removeCameraData();

  }


 }catch(error){

  console.error(error);

 }


 location.reload();

};



window.addEventListener(
 "beforeunload",
 function(){

  stopCamera();

 }
);


console.log(
 "🔥 XO Online + Camera + Audio جاهز"
);

</script>
