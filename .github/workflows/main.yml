name: Build XO Online APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Gradle
        run: |
          gradle --version

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/xo/online
          mkdir -p app/src/main/assets

          cp index.html app/src/main/assets/index.html

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "XOOnline"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.xo.online"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.xo.online"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-ktx:1.10.1")
              implementation("androidx.webkit:webkit:1.12.1")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.CAMERA"/>

              <uses-feature
                  android:name="android.hardware.microphone"
                  android:required="false"/>

              <uses-feature
                  android:name="android.hardware.camera"
                  android:required="false"/>

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="XO Online"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/xo/online/MainActivity.kt <<'EOF'
          package com.xo.online

          import android.Manifest
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.view.ViewGroup
          import android.webkit.PermissionRequest
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.ComponentActivity
          import androidx.activity.OnBackPressedCallback
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.core.content.ContextCompat
          import androidx.webkit.WebViewAssetLoader

          class MainActivity : ComponentActivity() {

              private lateinit var webView: WebView
              private var pendingRequest: PermissionRequest? = null

              private val mediaPermissionLauncher =
                  registerForActivityResult(
                      ActivityResultContracts.RequestMultiplePermissions()
                  ) { result ->

                      val request = pendingRequest
                      pendingRequest = null

                      if (request == null) return@registerForActivityResult

                      val micGranted =
                          result[Manifest.permission.RECORD_AUDIO] == true ||
                          ContextCompat.checkSelfPermission(
                              this,
                              Manifest.permission.RECORD_AUDIO
                          ) == PackageManager.PERMISSION_GRANTED

                      val cameraGranted =
                          result[Manifest.permission.CAMERA] == true ||
                          ContextCompat.checkSelfPermission(
                              this,
                              Manifest.permission.CAMERA
                          ) == PackageManager.PERMISSION_GRANTED

                      val resources = request.resources.toSet()
                      val grants = mutableListOf<String>()

                      if (
                          PermissionRequest.RESOURCE_AUDIO_CAPTURE in resources &&
                          micGranted
                      ) {
                          grants.add(
                              PermissionRequest.RESOURCE_AUDIO_CAPTURE
                          )
                      }

                      if (
                          PermissionRequest.RESOURCE_VIDEO_CAPTURE in resources &&
                          cameraGranted
                      ) {
                          grants.add(
                              PermissionRequest.RESOURCE_VIDEO_CAPTURE
                          )
                      }

                      if (grants.isNotEmpty()) {
                          request.grant(grants.toTypedArray())
                      } else {
                          request.deny()
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  webView = WebView(this)

                  webView.layoutParams = ViewGroup.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT
                  )

                  webView.setBackgroundColor(
                      Color.rgb(5, 6, 13)
                  )

                  val settings = webView.settings

                  settings.javaScriptEnabled = true
                  settings.domStorageEnabled = true
                  settings.mediaPlaybackRequiresUserGesture = false
                  settings.allowContentAccess = true
                  settings.allowFileAccess = false
                  settings.javaScriptCanOpenWindowsAutomatically = true

                  val assetLoader =
                      WebViewAssetLoader.Builder()
                          .addPathHandler(
                              "/assets/",
                              WebViewAssetLoader.AssetsPathHandler(this)
                          )
                          .build()

                  webView.webViewClient =
                      object : WebViewClient() {

                          override fun shouldInterceptRequest(
                              view: WebView,
                              request: WebResourceRequest
                          ): WebResourceResponse? {
                              return assetLoader.shouldInterceptRequest(
                                  request.url
                              )
                          }

                          @Suppress("DEPRECATION")
                          override fun shouldInterceptRequest(
                              view: WebView,
                              url: String
                          ): WebResourceResponse? {
                              return assetLoader.shouldInterceptRequest(
                                  Uri.parse(url)
                              )
                          }
                      }

                  webView.webChromeClient =
                      object : WebChromeClient() {

                          override fun onPermissionRequest(
                              request: PermissionRequest
                          ) {

                              runOnUiThread {

                                  if (
                                      request.origin.host !=
                                      "appassets.androidplatform.net"
                                  ) {
                                      request.deny()
                                      return@runOnUiThread
                                  }

                                  val needsMic =
                                      request.resources.contains(
                                          PermissionRequest.RESOURCE_AUDIO_CAPTURE
                                      )

                                  val needsCamera =
                                      request.resources.contains(
                                          PermissionRequest.RESOURCE_VIDEO_CAPTURE
                                      )

                                  val micGranted =
                                      ContextCompat.checkSelfPermission(
                                          this@MainActivity,
                                          Manifest.permission.RECORD_AUDIO
                                      ) ==
                                      PackageManager.PERMISSION_GRANTED

                                  val cameraGranted =
                                      ContextCompat.checkSelfPermission(
                                          this@MainActivity,
                                          Manifest.permission.CAMERA
                                      ) ==
                                      PackageManager.PERMISSION_GRANTED

                                  if (
                                      (!needsMic || micGranted) &&
                                      (!needsCamera || cameraGranted)
                                  ) {
                                      request.grant(request.resources)
                                      return@runOnUiThread
                                  }

                                  pendingRequest = request

                                  val permissions =
                                      mutableListOf<String>()

                                  if (needsMic && !micGranted) {
                                      permissions.add(
                                          Manifest.permission.RECORD_AUDIO
                                      )
                                  }

                                  if (needsCamera && !cameraGranted) {
                                      permissions.add(
                                          Manifest.permission.CAMERA
                                      )
                                  }

                                  if (permissions.isNotEmpty()) {
                                      mediaPermissionLauncher.launch(
                                          permissions.toTypedArray()
                                      )
                                  } else {
                                      request.deny()
                                  }
                              }
                          }
                      }

                  setContentView(webView)

                  webView.loadUrl(
                      "https://appassets.androidplatform.net/assets/index.html"
                  )

                  onBackPressedDispatcher.addCallback(
                      this,
                      object : OnBackPressedCallback(true) {

                          override fun handleOnBackPressed() {

                              if (webView.canGoBack()) {
                                  webView.goBack()
                              } else {
                                  finish()
                              }
                          }
                      }
                  )
              }

              override fun onDestroy() {
                  webView.destroy()
                  super.onDestroy()
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XO-Online-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
